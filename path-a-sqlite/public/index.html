<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To do list</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='11' fill='none' stroke='%231C2541' stroke-width='3'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="topbar">
      <h1 class="brand">To do list</h1>
    </div>

    <header class="day">
      <button class="nav" id="prev" type="button" aria-label="이전 날">‹</button>
      <div class="day-title">
        <span class="day-num" id="day-num"></span>
        <span class="day-meta">
          <span id="day-month"></span>
          <span id="day-week"></span>
        </span>
      </div>
      <button class="nav" id="next" type="button" aria-label="다음 날">›</button>
      <button class="today-btn" id="go-today" type="button">오늘로</button>
    </header>

    <p class="tally" id="tally" aria-live="polite"></p>

    <form class="add" id="add-form" autocomplete="off">
      <label class="sr-only" for="title">할 일</label>
      <input id="title" name="title" maxlength="200" placeholder="할 일을 적고 Enter" required>
      <button type="submit">추가</button>
      <div class="add-extra">
        <label>마감일 <input type="date" id="due"></label>
        <label>태그 <input id="tags" placeholder="업무, 공부"></label>
      </div>
    </form>

    <p class="message" id="message" role="alert" hidden></p>

    <ul class="list" id="list" aria-label="할 일 목록"></ul>
    <p class="empty" id="empty" hidden>이 날에는 아직 할 일이 없어요. 위에 적어서 추가해 보세요.</p>
  </main>

  <template id="item-tpl">
    <li class="item">
      <div class="marks" role="group" aria-label="진행 상태 (다시 누르면 표시 해제)">
        <button type="button" class="mark" data-status="done" aria-label="완료">○</button>
        <button type="button" class="mark" data-status="doing" aria-label="시작했지만 미완료">△</button>
        <button type="button" class="mark" data-status="todo" aria-label="시작 못 함">✕</button>
      </div>
      <div class="body">
        <p class="title"></p>
        <p class="info"></p>
        <div class="actions">
          <button type="button" class="act" data-act="tomorrow">다음 날로 미루기</button>
          <button type="button" class="act" data-act="pick">날짜 골라 옮기기</button>
          <button type="button" class="act" data-act="bring-back">다시 가져오기</button>
          <input type="date" class="pick-date" hidden aria-label="옮길 날짜">
          <button type="button" class="act" data-act="edit">수정</button>
          <button type="button" class="act danger" data-act="delete">삭제</button>
        </div>
      </div>
      <form class="edit" hidden>
        <input class="edit-title" maxlength="200" aria-label="할 일 내용" required>
        <div class="edit-extra">
          <label>마감일 <input type="date" class="edit-due"></label>
          <label>태그 <input class="edit-tags" placeholder="업무, 공부"></label>
        </div>
        <div class="edit-buttons">
          <button type="submit">저장</button>
          <button type="button" class="secondary" data-act="cancel-edit">취소</button>
        </div>
      </form>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
